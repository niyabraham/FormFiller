[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "formfill-poc"
version = "0.1.0"
description = "Minimal proof of concept: match JSON source data to PDF form fields, validate, fill, and verify -- abstaining instead of guessing when a field can't be confidently resolved."
requires-python = ">=3.11"
dependencies = [
    "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.hatch.build.targets.wheel]
packages = ["formfill"]

[tool.pytest.ini_options]
testpaths = ["tests"]
