name: Tests

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install project and test dependencies
        run: python -m pip install -e ".[dev]"
      - name: Install Chromium
        run: python -m playwright install --with-deps chromium
      - name: Run test suite
        run: python -m pytest -q -rf --junitxml=pytest-report.xml
      - name: Annotate failed tests
        if: failure()
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          try:
              root = ET.parse("pytest-report.xml").getroot()
          except Exception as exc:
              print(f"::error::no pytest report to annotate: {exc}")
              raise SystemExit(0)
          for case in root.iter("testcase"):
              for kind in ("failure", "error"):
                  node = case.find(kind)
                  if node is not None:
                      text = (node.get("message") or "") + "\n" + (node.text or "")[-1500:]
                      text = text.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
                      print(f"::error title={case.get('classname')}::{case.get('name')}: {text}")
          PY
