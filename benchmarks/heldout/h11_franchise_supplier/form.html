<!doctype html><html lang=en><head><meta charset=utf-8><title>h11_franchise_supplier</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>h11_franchise_supplier</h1><form>
<h2>Parties</h2>
<div class="row"><label for="q1">Legal name of franchisee entity</label><input type="text" name="f1" id="q1"></div>
<div class="row"><label for="q2">Franchisor legal name</label><input type="text" name="f2" id="q2"></div>
<div class="row"><label for="q3">Number of employees</label><input type="number" name="f3" id="q3"></div>
<div class="row"><label for="q4">Number of employees of the franchisee</label><input type="number" name="f4" id="q4"></div>
<div class="row"><label for="q5">Year founded</label><input type="number" name="f5" id="q5"></div>
<div class="row"><label for="q6">Year the franchisor was founded</label><input type="number" name="f6" id="q6"></div>
<div class="row"><label for="q7">Name of franchise owner / principal</label><input type="text" name="f7" id="q7"></div>
<h2>Stores</h2>
<div class="row"><label for="q8">Number of employees at the San Antonio store</label><input type="number" name="f8" id="q8"></div>
<div class="row"><label for="q9">Employees at store #131</label><input type="number" name="f9" id="q9"></div>
<div class="row"><label for="q10">Number of employees at the Houston store</label><input type="number" name="f10" id="q10"></div>
<div class="row"><label for="q11">Opening date of store 114</label><input type="date" name="f11" id="q11"></div>
<div class="row"><label for="q12">States in which the franchisor operates</label><select name="f12" id="q12" multiple><option value="TX">Texas</option><option value="OK">Oklahoma</option><option value="LA">Louisiana</option><option value="NM">New Mexico</option><option value="AR">Arkansas</option></select></div>
<h2>Joint venture</h2>
<div class="row"><label for="q13">Joint venture name</label><input type="text" name="f13" id="q13"></div>
<div class="row"><label for="q14">Franchisor&#x27;s ownership percentage in the joint venture</label><input type="number" name="f14" id="q14"></div>
<div class="row"><fieldset><legend>Is the applicant a joint venture?</legend><label class="opt"><input type="radio" name="f15" value="yes"> Yes</label><label class="opt"><input type="radio" name="f15" value="no"> No</label></fieldset></div>
<div class="row"><label for="q16">Franchisee tax ID</label><input type="text" name="f16" id="q16"></div>
<div class="row"><label for="q17">Describe the relationship between franchisor and franchisee</label><textarea name="f17" id="q17" rows=3></textarea></div>
</form><script></script></body></html>
