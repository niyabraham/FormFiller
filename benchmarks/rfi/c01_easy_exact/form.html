<!doctype html><html lang=en><head><meta charset=utf-8><title>c01_easy_exact</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c01_easy_exact</h1><form>
<div class="row"><label for="q1">Company name</label><input type="text" name="company_name" required id="q1"></div>
<div class="row"><label for="q2">Website</label><input type="url" name="website" id="q2"></div>
<div class="row"><label for="q3">Number of employees</label><input type="number" name="employees" id="q3"></div>
<div class="row"><label for="q4">Founded</label><input type="date" name="founded" id="q4"></div>
<div class="row"><label for="q5">Country</label><select name="country" id="q5"><option value="">Select...</option><option value="India">India</option><option value="Canada">Canada</option><option value="United States">United States</option></select></div>
<div class="row"><label for="q6">Contact email</label><input type="email" name="contact_email" id="q6"></div>
<div class="row"><label for="q7">Phone</label><input type="tel" name="phone" id="q7"></div>
<div class="row"><fieldset><legend>SSO supported</legend><label class="opt"><input type="radio" name="sso_supported" value="yes"> Yes</label><label class="opt"><input type="radio" name="sso_supported" value="no"> No</label></fieldset></div>
<div class="row"><label class="opt"><input type="checkbox" name="newsletter_opt_in" value="yes"> Newsletter opt in</label></div>
<div class="row"><label for="q10">Plan tier</label><select name="plan_tier" id="q10"><option value="">Select...</option><option value="Starter">Starter</option><option value="Business">Business</option><option value="Enterprise">Enterprise</option></select></div>
<div class="row"><label for="q11">Description</label><textarea name="description" id="q11" rows=3></textarea></div>
<div class="row"><label for="q12">Fax</label><input type="text" name="fax" id="q12"></div>
</form><script></script></body></html>
