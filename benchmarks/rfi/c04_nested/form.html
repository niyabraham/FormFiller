<!doctype html><html lang=en><head><meta charset=utf-8><title>c04_nested</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c04_nested</h1><form>
<h2>Headquarters address</h2>
<div class="row"><label for="q1">Street</label><input type="text" name="hq_street" id="q1"></div>
<div class="row"><label for="q2">City</label><input type="text" name="hq_city" id="q2"></div>
<h2>Billing address</h2>
<div class="row"><label for="q3">Street</label><input type="text" name="bill_street" id="q3"></div>
<div class="row"><label for="q4">Postal code</label><input type="text" name="bill_pc" id="q4"></div>
<h2>Company</h2>
<div class="row"><label for="q5">Legal name of the company</label><input type="text" name="legal" id="q5"></div>
<div class="row"><label for="q6">Brand name</label><input type="text" name="brand" id="q6"></div>
<h2>Leadership</h2>
<div class="row"><label for="q7">CISO name</label><input type="text" name="ciso" id="q7"></div>
<div class="row"><label for="q8">CEO email</label><input type="email" name="ceo" id="q8"></div>
<h2>Compliance</h2>
<div class="row"><label for="q9">Date of last SOC 2 audit</label><input type="date" name="soc_date" id="q9"></div>
<div class="row"><fieldset><legend>Which certifications do you hold?</legend><label class="opt"><input type="checkbox" name="certs" value="iso27001"> ISO 27001</label><label class="opt"><input type="checkbox" name="certs" value="soc2"> SOC 2</label><label class="opt"><input type="checkbox" name="certs" value="pci"> PCI DSS</label><label class="opt"><input type="checkbox" name="certs" value="hipaa"> HIPAA</label></fieldset></div>
</form><script></script></body></html>
