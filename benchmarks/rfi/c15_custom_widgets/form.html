<!doctype html><html lang=en><head><meta charset=utf-8><title>c15_custom_widgets</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c15_custom_widgets</h1><form>
<div class="row"><label for="q1">Company name</label><input type="text" name="w_name" id="q1"></div>
<div class="row"><div role="radiogroup" aria-label="Do you support SSO?" data-qname="w_sso"><div role="radio" aria-checked="false" tabindex="0" class="fake">Yes</div><div role="radio" aria-checked="false" tabindex="0" class="fake">No</div></div></div>
<div class="row"><div role="combobox" aria-label="Country" aria-expanded="false" tabindex="0" class="fake" data-qname="w_country">Select...</div></div>
<div class="row"><button type="button" role="switch" aria-checked="false" aria-label="Newsletter opt in" data-qname="w_news">Off</button></div>
<div class="row"><div role="textbox" aria-label="Describe your business" aria-multiline="true" contenteditable="true" class="fake box" data-qname="w_desc"></div></div>
<div class="row"><acme-field label="Company website" qname="w_shadow"></acme-field></div>
<div class="row"><label for="q7">Upload your SOC 2 report</label><input type="file" name="w_file" id="q7"></div>
</form><script>
customElements.define('acme-field',class extends HTMLElement{connectedCallback(){
 const r=this.attachShadow({mode:'open'});r.innerHTML='<label>'+this.getAttribute('label')+
 '<input type="text" name="'+this.getAttribute('qname')+'"></label>'}});
</script></body></html>
