<!doctype html><html lang=en><head><meta charset=utf-8><title>c02_paraphrase</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c02_paraphrase</h1><form>
<div class="row"><label for="q1">How many employees are currently employed by your organization?</label><input type="number" name="w1" id="q1"></div>
<div class="row"><label for="q2">What is the size of your workforce?</label><input type="number" name="w2" id="q2"></div>
<div class="row"><label for="q3">Total staff headcount</label><input type="number" name="w3" id="q3"></div>
<div class="row"><label for="q4">Number of personnel</label><input type="number" name="w4" id="q4"></div>
<div class="row"><label for="q5">In which city is your headquarters located?</label><input type="text" name="hq" id="q5"></div>
<div class="row"><label for="q6">In what year was your company established?</label><input type="number" name="est" min="1800" max="2100" id="q6"></div>
<div class="row"><label for="q7">What was your annual revenue?</label><input type="number" name="rev" step="any" id="q7"></div>
<div class="row"><label for="q8">Registered legal entity name</label><input type="text" name="legal" id="q8"></div>
<div class="row"><label for="q9">Company trading name / DBA</label><input type="text" name="dba" id="q9"></div>
<div class="row"><label for="q10">Main telephone number</label><input type="tel" name="tel" id="q10"></div>
<div class="row"><label for="q11">Customer support contact e-mail</label><input type="email" name="supp" id="q11"></div>
<div class="row"><label for="q12">Guaranteed availability (SLA %)</label><input type="number" name="sla" step="any" id="q12"></div>
<div class="row"><label for="q13">Number of data centres</label><input type="number" name="dc1" id="q13"></div>
<div class="row"><label for="q14">How many data centers do you operate?</label><input type="number" name="dc2" id="q14"></div>
</form><script></script></body></html>
