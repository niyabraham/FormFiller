<!doctype html><html lang=en><head><meta charset=utf-8><title>c12_validation</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c12_validation</h1><form>
<div class="row"><label for="q1">Number of employees</label><input type="number" name="emp" id="q1"></div>
<div class="row"><label for="q2">Founded</label><input type="date" name="fd" id="q2"></div>
<div class="row"><label for="q3">Incorporated</label><input type="date" name="inc" id="q3"></div>
<div class="row"><label for="q4">Website</label><input type="url" name="web" id="q4"></div>
<div class="row"><label for="q5">Contact email</label><input type="email" name="mail" id="q5"></div>
<div class="row"><label for="q6">Registration code</label><input type="text" name="regcode" pattern="[A-Z]{3}-[0-9]{4}" id="q6"></div>
<div class="row"><label for="q7">Legal name</label><input type="text" name="legal" maxlength="30" id="q7"></div>
<div class="row"><label for="q8">Revenue growth (%)</label><input type="number" name="growth" min="0" max="100" id="q8"></div>
<div class="row"><label for="q9">Tier</label><select name="tier" id="q9"><option value="">Select...</option><option value="Starter">Starter</option><option value="Business">Business</option><option value="Enterprise">Enterprise</option></select></div>
<div class="row"><label for="q10">Phone</label><input type="tel" name="phone" pattern="\+?[0-9 ]{8,15}" id="q10"></div>
<div class="row"><label for="q11">Stock ticker</label><input type="text" name="ticker" maxlength="4" id="q11"></div>
<div class="row"><label for="q12">Staff count</label><input type="number" name="staff" id="q12"></div>
<div class="row"><label for="q13">Average rating</label><input type="number" name="rating" step="0.1" id="q13"></div>
</form><script></script></body></html>
