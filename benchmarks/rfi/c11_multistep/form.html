<!doctype html><html lang=en><head><meta charset=utf-8><title>c11_multistep</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c11_multistep</h1><form>
<div id="steps">
<section data-step="1"><div class="row"><label for="q1">Company name</label><input type="text" name="company_name" id="q1"></div>
<div class="row"><label for="q2">Website</label><input type="url" name="website" id="q2"></div><button type="button" class="next" data-next="2">Next</button></section>
<section data-step="2" hidden><div class="row"><label for="q3">Number of employees</label><input type="number" name="employees" id="q3"></div>
<div class="row"><label for="q4">Country</label><select name="country" id="q4"><option value="">Select...</option><option value="India">India</option><option value="Canada">Canada</option><option value="United States">United States</option></select></div>
<div class="row"><label for="q5">Contact email</label><input type="email" name="contact_email" id="q5"></div><button type="button" class="next" data-next="3">Next</button></section>
<template id="tpl3"><div class="row"><fieldset><legend>SSO supported</legend><label class="opt"><input type="radio" name="sso_supported" value="yes"> Yes</label><label class="opt"><input type="radio" name="sso_supported" value="no"> No</label></fieldset></div>
<div class="row"><fieldset><legend>GDPR applicable</legend><label class="opt"><input type="radio" name="gdpr_applicable" value="yes"> Yes</label><label class="opt"><input type="radio" name="gdpr_applicable" value="no"> No</label></fieldset></div></template>
</div>
</form><script>
document.addEventListener('click',e=>{const b=e.target.closest('.next');if(!b)return;const n=b.dataset.next;
 let s=document.querySelector('section[data-step="'+n+'"]');
 if(!s){const t=document.getElementById('tpl'+n);s=document.createElement('section');s.dataset.step=n;
  s.appendChild(t.content.cloneNode(true));document.getElementById('steps').appendChild(s)}
 s.hidden=false});
</script></body></html>
