<!doctype html><html lang=en><head><meta charset=utf-8><title>c14_label_styles</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c14_label_styles</h1><form>
<div class="row"><label for="q1">Company name</label><input type="text" name="s1" id="q1"></div>
<div class="row"><label>Website <input type="url" name="s2"></label></div>
<div class="row"><input type="number" name="s3" aria-label="Number of employees"></div>
<div class="row"><span id="q4_l">Contact email</span><input type="email" name="s4" aria-labelledby="q4_l"></div>
<div class="row"><input type="tel" name="s5" placeholder="Phone"></div>
<div class="row"><div class="q">Date founded</div><input type="date" name="s6"></div>
<div class="row"><table><tr><td>Legal name</td><td><input type="text" name="s7"></td></tr></table></div>
<div class="row"><label for="q8_missing">City</label><input type="text" name="s8" id="q8"></div>
<div class="row"><label for="q9">1. Industry (required) *</label><input type="text" name="s9" id="q9"></div>
<div class="row"><div class="q">Country</div><select name="s10"><option value="">Select...</option><option value="India">India</option><option value="Canada">Canada</option><option value="United States">United States</option></select></div>
<div class="row"><div class="q">Company website</div><input type="url" name="website_url"></div>
<div class="row"><table><tr><td>How many people work for you?</td><td><input type="number" name="employee_count"></td></tr></table></div>
</form><script></script></body></html>
