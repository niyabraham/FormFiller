<!doctype html><html lang=en><head><meta charset=utf-8><title>c09_narrative</title><style>
body{font:15px system-ui,sans-serif;max-width:760px;margin:24px auto;padding:0 16px;color:#222}
h1{font-size:20px} h2{font-size:16px;margin-top:26px;border-bottom:1px solid #ccc}
.row{margin:12px 0} label,.q{display:block;font-weight:600;margin-bottom:4px}
label.opt{display:inline-block;font-weight:400;margin-right:14px} fieldset{border:1px solid #ccc}
input[type=text],input[type=email],input[type=url],input[type=tel],input[type=number],input[type=date],select,textarea{width:100%;box-sizing:border-box;padding:6px}
.fake{border:1px solid #888;padding:6px;margin:2px;display:inline-block;min-width:60px} .box{display:block;min-height:50px}
[hidden]{display:none!important} #msg{margin-top:14px;font-weight:600} .err{color:#b00020}
</style></head><body><h1>c09_narrative</h1><form>
<div class="row"><label for="q1">Describe your incident response process.</label><textarea name="n1" id="q1" rows=3></textarea></div>
<div class="row"><label for="q2">Provide a summary of your information security program.</label><textarea name="n2" id="q2" rows=3></textarea></div>
<div class="row"><label for="q3">Describe your encryption practices.</label><textarea name="n3" id="q3" rows=3></textarea></div>
<div class="row"><label for="q4">What encryption standard do you use for data at rest?</label><input type="text" name="n4" id="q4"></div>
<div class="row"><label for="q5">Briefly describe your company.</label><textarea name="n5" id="q5" rows=3></textarea></div>
<div class="row"><label for="q6">Describe how you handle vendor risk management.</label><textarea name="n6" id="q6" rows=3></textarea></div>
<div class="row"><label for="q7">Who is your incident response point of contact?</label><input type="text" name="n7" id="q7"></div>
<div class="row"><label for="q8">What is your incident notification SLA (hours)?</label><input type="number" name="n8" id="q8"></div>
<div class="row"><label for="q9">Date of last incident response test</label><input type="date" name="n9" id="q9"></div>
<div class="row"><label for="q10">Describe your incident response process and your breach notification timeline.</label><textarea name="n10" id="q10" rows=3></textarea></div>
</form><script></script></body></html>
