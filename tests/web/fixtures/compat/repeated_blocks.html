<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Repeated questions</title></head><body>
<!-- Local fixture (fictional). The same two questions asked twice, once per contact, told apart only by the fieldset legend. -->
<h1>Contacts</h1>
<fieldset><legend>Primary contact</legend>
  <label for="p_name">Full name</label><input id="p_name"><label for="p_email">Email</label><input id="p_email" type="email"></fieldset>
<fieldset><legend>Billing contact</legend>
  <label for="b_name">Full name</label><input id="b_name"><label for="b_email">Email</label><input id="b_email" type="email"></fieldset>
</body></html>
