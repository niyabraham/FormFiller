<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Dates and numbers</title></head><body>
<!-- Local fixture (fictional). Native date with min/max, a decimal number with step, a whole number with max, and a text
     date field that shows its format (DD/MM/YYYY). -->
<h1>Insurance and finance</h1>
<label for="expiry">Insurance policy expiry date</label><input id="expiry" type="date" min="2026-01-01" max="2030-12-31">
<label for="revenue">Annual revenue (USD millions)</label><input id="revenue" type="number" step="0.01" min="0">
<label for="staff">Number of employees</label><input id="staff" type="number" min="1" max="1000">
<label for="founded">Date of incorporation</label><input id="founded" placeholder="DD/MM/YYYY">
</body></html>
